name: lorbin_env
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.12
  - minimap2
  - hmmer
  - prodigal
  - bedtools
  - samtools
  - pip
  - pip:
      - biopython==1.85
      - numpy==1.26.4
      - pandas==2.2.2
      - scikit-learn==1.5.2
      - scipy==1.13.1
      - joblib==1.4.2


